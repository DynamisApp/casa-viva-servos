<script>

const IC={home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',esc:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',mus:'<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',pes:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.4 0 4 1.7 4 4"/></svg>'};
let S={tab:'home',mode:'in',me:null,uid:null,vin:[],esc:[],min:{},fun:{},ev:[],menu:false,mus:[],set:[],q:'',mEv:null,mForm:null,sf:[],hist:[],sem:[],fEdit:null,hl:null,hlS:null,pal:[],rep:[],cels:[],celOpen:false,celEd:null,addFor:null,pmin:null,eq:[],lid:[],todos:[],page:'',av:[],an:[],anList:[],anMes:null,aForm:false};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3800)}

async function authView(){
  const [{data},{data:cl}]=await Promise.all([sb.from('ministerios').select('id,nome').eq('ativo_no_app',true).order('nome'),sb.from('celulas').select('id,nome').order('nome')]);

  <div class="seg"><button data-act="mode" data-v="in" class="${up?'':'on'}">Entrar</button><button data-act="mode" data-v="up" class="${up?'on':''}">Cadastrar</button></div>

  <button class="btn" data-act="${up?'signup':'signin'}">${up?'Criar meu cadastro':'Entrar'}</button></div>
  ${up?'<p class="mu sm" style="text-align:center;margin-top:14px">Depois do cadastro, o líder do seu ministério precisa aprovar.</p>':''}</div>`;
}
async function signup(){
  const g=id=>$(id).value.trim();
  if(g('nome').split(/\s+/).length<2)return toast('Digite o nome completo.');
  if(!g('min'))return toast('Escolha o ministério.');
  if(!g('cel'))return toast('Escolha a sua célula ou "Ainda não estou em uma célula".');
  if(g('pw').length<6)return toast('A senha precisa ter 6 caracteres ou mais.');
  const {data,error}=await sb.auth.signUp({email:g('em'),password:g('pw'),options:{data:{nome_completo:g('nome'),whatsapp:g('wpp'),ministerio_id:g('min'),celula_id:g('cel'),aniv_dia:g('ad'),aniv_mes:g('am')}}});
  if(error)return toast(error.message);
  if(!data.session){S.mode='in';await authView();toast('Cadastro criado. Confirme o e-mail e depois entre.')}
}

  const q=(t,s)=>sb.from(t).select(s);
  const [me,mins,funs,evs,cl]=await Promise.all([q('servos','id,nome_completo,admin_geral,aniv_dia,aniv_mes,celula_id,sem_celula,whatsapp').eq('user_id',S.uid).maybeSingle(),q('ministerios','id,nome,ativo_no_app'),q('funcoes','id,nome,ministerio_id'),q('eventos','id,nome,inicio,ceia,paleta,ceia_confirmada').gte('inicio',new Date(Date.now()-12096e5).toISOString()).order('inicio'),q('celulas','id,nome,ativa').order('nome')]);
  if(me.error)return toast(me.error.message);
  S.me=me.data;
  if(!S.me){app.innerHTML=`<div class="auth">${LOGO()}<h1 style="margin-top:18px">Cadastro não encontrado</h1><p class="sub">Seu login existe, mas não está ligado a um servo. Fale com o líder do seu ministério ou com a administração.</p><button class="btn" data-act="out">Sair</button></div>`;return}
  S.min=Object.fromEntries((mins.data||[]).map(m=>[m.id,m]));
  S.fun=Object.fromEntries((funs.data||[]).map(f=>[f.id,f]));
  S.ev=evs.data||[];S.cels=cl.data||[];
  await refresh();
}
