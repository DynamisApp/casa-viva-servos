<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Casa Viva · Servos</title>
<style>
:root{--bg:#161616;--card:#222;--tx:#f2eee8;--mu:#a49c92;--ac:#4a9bff;--bd:#333;--ok:#2a9d6a;--wn:#e0a82b}
@media (prefers-color-scheme:light){:root{--bg:#f4f1ec;--card:#fff;--tx:#1d1a17;--mu:#6b645c;--ac:#1b6fd8;--bd:#ddd6cc}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;padding-top:env(safe-area-inset-top,0)}
#app{width:100%;max-width:440px;min-height:100vh;position:relative}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
.av{width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
header b{flex:1;font-size:17px}header small{display:block;color:var(--mu);font-weight:400;font-size:12px}
main{padding:0 14px calc(100px + env(safe-area-inset-bottom,0))}
h2{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{display:flex;gap:8px;margin-top:10px}.row2 .btn{flex:1}
.mu{color:var(--mu)}.sm{font-size:13px}p{margin-top:4px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}.btn.sm{padding:8px 12px;width:auto}
.ghost{background:none;border:0;color:var(--mu);font-size:14px;cursor:pointer;padding:6px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--bd);color:var(--mu)}
.tag.confirmado{background:var(--ok);color:#fff}.tag.troca_solicitada{background:var(--wn);color:#222}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:7px 13px;font-size:14px}
.warn{background:var(--wn);color:#222;border-radius:14px;padding:12px 14px;margin-top:6px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:5px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
nav{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:6px}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 0;font-size:12px;font-weight:600;cursor:pointer;position:relative}
nav button.on{color:var(--ac)}nav span{display:block;font-size:19px}
nav i{position:absolute;top:2px;right:24%;background:#e5484d;color:#fff;border-radius:999px;font-style:normal;font-size:10px;padding:1px 6px}
.auth{padding:34px 18px}.auth .logo{font-size:44px;text-align:center}.auth h1{text-align:center;margin-top:6px}.auth>.mu{text-align:center;margin-bottom:18px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:10px;border-radius:9px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:88%;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://oouecxkgetmsdwvsnyva.supabase.co',SB_KEY='sb_publishable_jpFQmYIK-9wWjDqHGgPicg_khKqOz8l';
const sb=supabase.createClient(SB_URL,SB_KEY);
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={pendente:'Pendente',confirmado:'Confirmado',troca_solicitada:'Troca pedida',recusado:'Recusado'};
const fmt=d=>new Date(d).toLocaleString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'America/Fortaleza'});
let S={tab:'home',mode:'in',me:null,uid:null,vin:[],esc:[],min:{},fun:{},ev:[]};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3800)}

async function authView(){
  const {data}=await sb.from('ministerios').select('id,nome').eq('ativo_no_app',true).order('nome');
  const opts=(data||[]).map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('');
  const up=S.mode==='up';
  app.innerHTML=`<div class="auth"><div class="logo">⛪</div><h1>Casa Viva</h1><p class="mu">Escalas de servos</p>
  <div class="seg"><button data-act="mode" data-v="in" class="${up?'':'on'}">Entrar</button><button data-act="mode" data-v="up" class="${up?'on':''}">Cadastrar</button></div>
  <div class="card">${up?`<label>Nome completo<input id="nome" autocomplete="name"></label><label>WhatsApp<input id="wpp" type="tel" autocomplete="tel"></label><label>Ministério onde serve<select id="min"><option value="">Escolha…</option>${opts}</select></label>`:''}
  <label>E-mail<input id="em" type="email" autocomplete="email"></label>
  <label>Senha<input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="mínimo 6 caracteres"></label>
  <button class="btn" data-act="${up?'signup':'signin'}">${up?'Criar meu cadastro':'Entrar'}</button></div>
  ${up?'<p class="mu sm">Depois do cadastro, o líder do seu ministério precisa aprovar.</p>':''}</div>`;
}
async function signup(){
  const g=id=>$(id).value.trim();
  if(g('nome').split(/\s+/).length<2)return toast('Digite o nome completo.');
  if(!g('min'))return toast('Escolha o ministério.');
  if(g('pw').length<6)return toast('A senha precisa ter 6 caracteres ou mais.');
  const {data,error}=await sb.auth.signUp({email:g('em'),password:g('pw'),options:{data:{nome_completo:g('nome'),whatsapp:g('wpp'),ministerio_id:g('min')}}});
  if(error)return toast(error.message);
  if(!data.session){S.mode='in';await authView();toast('Cadastro criado. Confirme o e-mail e depois entre.')}
}
async function load(){
  const q=(t,s)=>sb.from(t).select(s);
  const [me,mins,funs,evs]=await Promise.all([q('servos','id,nome_completo,admin_geral').eq('user_id',S.uid).maybeSingle(),q('ministerios','id,nome,ativo_no_app'),q('funcoes','id,nome,ministerio_id'),q('eventos','id,nome,inicio,ceia').gte('inicio',new Date(Date.now()-864e5).toISOString()).order('inicio')]);
  if(me.error)return toast(me.error.message);
  S.me=me.data;
  if(!S.me){app.innerHTML=`<div class="auth"><h1>Cadastro não encontrado</h1><p class="mu" style="text-align:center">Seu login existe, mas não está ligado a um servo. Fale com o líder do seu ministério ou com a administração.</p><br><button class="btn" data-act="out">Sair</button></div>`;return}
  S.min=Object.fromEntries((mins.data||[]).map(m=>[m.id,m]));
  S.fun=Object.fromEntries((funs.data||[]).map(f=>[f.id,f]));
  S.ev=evs.data||[];
  await refresh();
}
async function refresh(){
  const [v,e]=await Promise.all([sb.from('servo_ministerios').select('servo_id,ministerio_id,lider,aprovado,servos(nome_completo,whatsapp)'),sb.from('escalas').select('id,evento_id,ministerio_id,funcao_id,servo_id,status')]);
  S.vin=v.data||[];S.esc=e.data||[];render();
}
const mine=()=>S.vin.filter(v=>v.servo_id===S.me.id);
const manMins=()=>S.me.admin_geral?Object.values(S.min).filter(m=>m.ativo_no_app):mine().filter(v=>v.lider&&v.aprovado).map(v=>S.min[v.ministerio_id]).filter(Boolean);
function myEsc(){return S.esc.filter(e=>e.servo_id===S.me.id).map(e=>({...e,ev:S.ev.find(x=>x.id===e.evento_id)})).filter(e=>e.ev&&new Date(e.ev.inicio)>Date.now()-144e5).sort((a,b)=>new Date(a.ev.inicio)-new Date(b.ev.inicio))}
function escCard(e){return `<div class="card"><div class="row"><b>${esc(e.ev.nome)}${e.ev.ceia?' · Ceia':''}</b><span class="tag ${e.status}">${ST[e.status]}</span></div><p class="mu">${fmt(e.ev.inicio)}</p><p>${esc(S.min[e.ministerio_id]?.nome)} · <b>${esc(S.fun[e.funcao_id]?.nome)}</b></p>${e.status==='pendente'||e.status==='troca_solicitada'?`<div class="row2"><button class="btn" data-act="resp" data-id="${e.id}" data-v="confirmado">Confirmar</button><button class="btn alt" data-act="resp" data-id="${e.id}" data-v="troca_solicitada">Preciso trocar</button></div>`:''}</div>`}
function pgHome(){
  const pend=mine().filter(v=>!v.aprovado),ok=mine().filter(v=>v.aprovado),n=myEsc()[0];
  return `${pend.length?`<div class="warn">Aguardando aprovação do líder: <b>${pend.map(v=>esc(S.min[v.ministerio_id]?.nome)).join(', ')}</b>.</div>`:''}
  <h2>Próxima escala</h2>${n?escCard(n):'<div class="card mu">Você ainda não foi escalado.</div>'}
  <h2>Meus ministérios</h2><div class="chips">${ok.length?ok.map(v=>`<span class="chip">${esc(S.min[v.ministerio_id]?.nome)}${v.lider?' · líder':''}</span>`).join(''):'<span class="mu">Nenhum ainda.</span>'}</div>`}
function pgEsc(){
  const list=myEsc(),mm=manMins();
  let h=`<h2>Minhas escalas</h2>${list.length?list.map(escCard).join(''):'<div class="card mu">Nada por enquanto.</div>'}`;
  if(mm.length)h+=`<h2>Montar escala</h2><div class="card"><label>Culto<select id="fEv">${S.ev.filter(e=>new Date(e.inicio)>Date.now()).map(e=>`<option value="${e.id}">${esc(e.nome)} · ${fmt(e.inicio)}</option>`).join('')}</select></label><label>Ministério<select id="fMin">${mm.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select></label><label>Função<select id="fFun"></select></label><label>Servo<select id="fSer"></select></label><button class="btn" data-act="add">Escalar</button></div><div id="lista"></div>`;
  return h}
function fillSel(){
  const fe=$('fEv');if(!fe)return;const fm=$('fMin');
  if(S.sel){fe.value=S.sel.e;fm.value=S.sel.m}
  const draw=()=>{const m=fm.value;S.sel={e:fe.value,m};
    $('fFun').innerHTML=Object.values(S.fun).filter(f=>f.ministerio_id===m).map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('')||'<option value="">Sem funções cadastradas</option>';
    $('fSer').innerHTML=S.vin.filter(v=>v.ministerio_id===m&&v.aprovado).map(v=>`<option value="${v.servo_id}">${esc(v.servos?.nome_completo)}</option>`).join('')||'<option value="">Nenhum servo aprovado</option>';
    const rows=S.esc.filter(e=>e.evento_id===fe.value&&e.ministerio_id===m);
    $('lista').innerHTML='<h2>Escalados neste culto</h2>'+(rows.length?rows.map(e=>{const v=S.vin.find(x=>x.servo_id===e.servo_id&&x.ministerio_id===m);return `<div class="card row"><span><b>${esc(v?.servos?.nome_completo||'—')}</b><br><span class="mu">${esc(S.fun[e.funcao_id]?.nome)} · ${ST[e.status]}</span></span><button class="ghost" data-act="del" data-id="${e.id}">Remover</button></div>`}).join(''):'<div class="card mu">Ninguém escalado ainda.</div>')};
  fe.onchange=fm.onchange=draw;draw()}
function pgPes(){
  const ids=manMins().map(m=>m.id),rows=S.vin.filter(v=>ids.includes(v.ministerio_id)&&v.servo_id!==S.me.id);
  const pend=rows.filter(v=>!v.aprovado),ok=rows.filter(v=>v.aprovado);
  const card=(v,p)=>`<div class="card row"><span><b>${esc(v.servos?.nome_completo)}</b>${v.lider?' <span class="tag confirmado">líder</span>':''}<br><span class="mu">${esc(S.min[v.ministerio_id]?.nome)}${v.servos?.whatsapp?' · '+esc(v.servos.whatsapp):''}</span></span>${p?`<span class="row2"><button class="btn sm" data-act="apr" data-s="${v.servo_id}" data-m="${v.ministerio_id}">Aprovar</button><button class="ghost" data-act="rec" data-s="${v.servo_id}" data-m="${v.ministerio_id}">Recusar</button></span>`:''}</div>`;
  return `<h2>Pedidos de cadastro (${pend.length})</h2>${pend.length?pend.map(v=>card(v,1)).join(''):'<div class="card mu">Nenhum pedido.</div>'}<h2>Servos (${ok.length})</h2>${ok.length?ok.map(v=>card(v,0)).join(''):'<div class="card mu">Ainda não há servos aprovados.</div>'}`}
function render(){
  const mm=manMins(),man=mm.length>0,tabs=[['home','Home','⌂'],['esc','Escalas','▦']];if(man)tabs.push(['pes','Pessoas','☺']);
  const ids=mm.map(m=>m.id),pend=S.vin.filter(v=>!v.aprovado&&v.servo_id!==S.me.id&&ids.includes(v.ministerio_id)).length;
  if(S.tab==='pes'&&!man)S.tab='home';
  const body=S.tab==='esc'?pgEsc():S.tab==='pes'?pgPes():pgHome();
  const role=S.me.admin_geral?'Administração':mine().some(v=>v.lider&&v.aprovado)?'Líder':'Servo';
  app.innerHTML=`<header><div class="av">${esc(S.me.nome_completo[0])}</div><b>${esc(S.me.nome_completo.split(' ')[0])}<small>${role}</small></b><button class="ghost" data-act="out">Sair</button></header><main>${body}</main><nav>${tabs.map(t=>`<button data-act="tab" data-v="${t[0]}" class="${S.tab===t[0]?'on':''}"><span>${t[2]}</span>${t[1]}${t[0]==='pes'&&pend?`<i>${pend}</i>`:''}</button>`).join('')}</nav>`;
  if(S.tab==='esc')fillSel()}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
  try{
    if(a==='mode'){S.mode=d.v;return authView()}
    if(a==='signin'){const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)toast(/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message);return}
    if(a==='signup')return signup();
    if(a==='out'){S.me=null;S.uid=null;await sb.auth.signOut();return}
    if(a==='tab'){S.tab=d.v;return refresh()}
    if(a==='resp'){const {error}=await sb.rpc('responder_escala',{p_escala:d.id,p_status:d.v});if(error)throw error;toast('Resposta enviada.')}
    if(a==='apr'){const {error}=await sb.from('servo_ministerios').update({aprovado:true}).eq('servo_id',d.s).eq('ministerio_id',d.m);if(error)throw error;toast('Servo aprovado.')}
    if(a==='rec'){if(!confirm('Recusar este pedido?'))return;const {error}=await sb.from('servo_ministerios').delete().eq('servo_id',d.s).eq('ministerio_id',d.m);if(error)throw error}
    if(a==='add'){const r={evento_id:$('fEv').value,ministerio_id:$('fMin').value,funcao_id:$('fFun').value,servo_id:$('fSer').value};if(!r.funcao_id||!r.servo_id)return toast('Escolha função e servo.');const {error}=await sb.from('escalas').insert(r);if(error)throw error;toast('Servo escalado.')}
    if(a==='del'){const {error}=await sb.from('escalas').delete().eq('id',d.id);if(error)throw error}
    await refresh();
  }catch(e){toast(/duplicate|unique/i.test(e.message)?'Esse servo já está escalado neste culto.':e.message)}
});
sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='SIGNED_OUT'){S.uid=null;setTimeout(authView,0)}
  else if(s&&s.user&&S.uid!==s.user.id){S.uid=s.user.id;setTimeout(load,0)}
});
sb.auth.getSession().then(({data})=>{if(!data.session)authView()});
</script>
</body>
</html>
